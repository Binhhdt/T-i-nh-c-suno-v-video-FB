name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nếu repo có file source.zip (mã nguồn đầy đủ) thì giải nén ra,
      # ghi đè lên file cũ -> luôn đủ thư mục android/, lib/, pubspec.yaml.
      - name: Giải nén source.zip
        run: |
          if [ -f source.zip ]; then
            unzip -o -q source.zip -d .
            echo "Đã giải nén source.zip"
          fi
          echo "--- Kiểm tra file quan trọng ---"
          ls -la
          ls android/app/src/main/AndroidManifest.xml
          ls pubspec.yaml lib/main.dart

      # Ghi lại android/gradlew chuẩn (bản cũ bị sửa trỏ vào /home/hatch/...
      # nên GitHub báo "not found"). Bước này luôn chạy, không phụ thuộc zip.
      - name: Sửa gradlew
        run: |
          cat > android/gradlew <<'SCRIPT'
          #!/bin/sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd -P)
          exec java $JAVA_OPTS $GRADLE_OPTS -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
          SCRIPT
          sed -i 's/^          //' android/gradlew
          chmod +x android/gradlew
          echo "--- gradlew mới ---"
          cat android/gradlew
          ls -la android/gradle/wrapper/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
        continue-on-error: true
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fb-video-downloader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
