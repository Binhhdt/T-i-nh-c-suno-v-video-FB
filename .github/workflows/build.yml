name: Build APK

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - name: Cài công cụ kiểm thử media
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: flutter test --no-pub

      - name: Kiểm tra APK release
        if: github.event_name == 'pull_request' || (github.ref_name != 'main' && github.ref_name != 'master')
        env:
          ANDROID_VERIFY_BUILD: 'true'
        run: flutter build apk --release --no-pub

      - name: Ký APK phát hành
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-key.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          flutter build apk --release --no-pub

      - name: Chuẩn bị APK phát hành
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  release:
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
      - name: Đổi tên APK
        run: mv app-release.apk "TaiVideoNhac-v${{ github.run_number }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: TaiVideoNhac-v${{ github.run_number }}.apk
